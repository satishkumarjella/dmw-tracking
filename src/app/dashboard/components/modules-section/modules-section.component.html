<section class="modules-section" [class.compact]="!isDashboardRoute">
  <div class="sidebar-toggle ion-justify-content-center" *ngIf="!isDashboardRoute">
    <div class="sidebar-logo" *ngIf="!isSidebarCollapsed && configService.config() as config">
      <img [src]="config.logoUrl" alt="{{ config.vendorName }} Logo" />
    </div>
    <ion-button class="sidebar-toggle-btn" fill="clear" (click)="toggleSidebar.emit()" size="medium">
      <ion-icon slot="icon-only" [name]="isSidebarCollapsed ? 'menu-outline' : 'chevron-back-outline'"></ion-icon>
    </ion-button>
  </div>

  <div class="grid-bottom" *ngIf="configService.config() as config">
    @for (module of config.modules; track module.id) {
      <a (click)="navigate.emit(module.route)" class="card" [class.active]="activeModule === module.id"
         [style.--card-accent]="module.colorHex" [style.--card-accent-rgb]="module.colorRgb">
        <div class="icon-badge">
          <span [innerHTML]="module.iconSvg | safeHtml"></span>
          <span class="card-num">{{ module.shortName }}</span>
        </div>
        <div class="card-title">
          <span class="desktop-title">{{ module.title }}</span>
          <span class="mobile-title">{{ module.shortName }}</span>
        </div>
        <div class="card-divider"></div>
        <p class="card-desc">{{ module.desc }}</p>
        <div class="card-cta">Open Module <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg></div>
      </a>
    }
  </div>
</section>
