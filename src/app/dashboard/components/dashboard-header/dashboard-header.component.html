<ion-header class="portal-header ion-no-border">
  <app-header class="top-app-header" [showLogo]="isDashboardRoute || isSidebarCollapsed" [showBack]="false">
    <div class="header-actions">
      <ion-button id="settings-button" class="header-icon-btn" fill="clear" size="small">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <ion-popover trigger="settings-button" side="bottom" alignment="end" [dismissOnSelect]="true" cssClass="custom-portal-popover">
      <ng-template>
        <ion-content class="ion-no-padding" [scrollY]="false">
          <div class="popover-inner">
            <ion-list lines="none">
              <!-- Account Section -->
              <ion-item button (click)="profileOpened.emit()">
                <div class="item-icon-box"><ion-icon name="person-circle-outline"></ion-icon></div>
                <ion-label><div class="menu-title">My Profile</div></ion-label>
              </ion-item>
              
              <!-- Workspace Section -->
              <ion-item button>
                <div class="item-icon-box"><ion-icon name="business-outline"></ion-icon></div>
                <ion-label><div class="menu-title">Workspace Settings</div></ion-label>
              </ion-item>
              <ion-item button>
                <div class="item-icon-box"><ion-icon name="people-outline"></ion-icon></div>
                <ion-label><div class="menu-title">Team Management</div></ion-label>
              </ion-item>
              <ion-item button>
                <div class="item-icon-box"><ion-icon name="card-outline"></ion-icon></div>
                <ion-label><div class="menu-title">Billing & Plans</div></ion-label>
              </ion-item>

              <!-- Preferences & Help -->
              <ion-item>
                <div class="item-icon-box" style="color: var(--text-main);"><ion-icon [name]="isDark() ? 'moon-outline' : 'sunny-outline'"></ion-icon></div>
                <ion-label><div class="menu-title" style="color: var(--text-main);">{{ isDark() ? 'Dark Mode' : 'Light Mode' }}</div></ion-label>
                <ion-toggle slot="end" [checked]="isDark()" (ionChange)="toggleTheme()"></ion-toggle>
              </ion-item>
              <ion-item button>
                <div class="item-icon-box"><ion-icon name="help-circle-outline"></ion-icon></div>
                <ion-label><div class="menu-title">Help & Documentation</div></ion-label>
              </ion-item>

              <div class="divider"></div>

              <!-- Sign Out -->
              <ion-item button class="logout-item" (click)="loggedOut.emit()">
                <div class="item-icon-box"><ion-icon name="log-out-outline"></ion-icon></div>
                <ion-label><div class="menu-title">Sign Out</div></ion-label>
              </ion-item>
            </ion-list>
          </div>
        </ion-content>
      </ng-template>
    </ion-popover>
  </app-header>

  <div class="module-top-bar compact-bar" *ngIf="!isDashboardRoute">
    <div class="glass-card compact-search">
      <div class="search-controls">
        <span class="status-dot"></span>
        <ion-searchbar 
          class="cyber-searchbar-mini" 
          placeholder="PO# or Scan" 
          [value]="globalPoSearch"
          (ionInput)="onSearchChange($any($event).detail.value)" 
          (keydown.enter)="searchTriggered.emit()">
        </ion-searchbar>
        <button class="mini-scan-btn" (click)="cameraScanTriggered.emit()">
          <ion-icon name="barcode-outline"></ion-icon>
        </button>
      </div>
    </div>

    <div class="glass-card compact-info">
      <div class="info-text">
        <h2 class="mini-title">{{ moduleTitle }}</h2>
        <span class="mini-badge" *ngIf="configService.config() as config">{{ config.vendorName.split(' ')[0] }}</span>
      </div>
      <button class="mini-info-btn" id="module-info-trigger">
        <ion-icon name="information-circle-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-header>
