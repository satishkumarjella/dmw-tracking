<div class="dashboard-layout" [class.has-sidebar]="!isDashboardRoute" [class.sidebar-collapsed]="isSidebarCollapsed" style="flex: 1;">

  <!-- SIDEBAR MODE (Starts from top of app layout) -->
  <app-modules-section class="sidebar-mode-section" *ngIf="!isDashboardRoute"
    [isDashboardRoute]="isDashboardRoute"
    [isSidebarCollapsed]="isSidebarCollapsed"
    [activeModule]="activeModule"
    (toggleSidebar)="toggleSidebar()"
    (navigate)="navigateToRoute($event)">
  </app-modules-section>

  <div class="main-content-area" style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
    <app-dashboard-header 
      [isDashboardRoute]="isDashboardRoute"
      [isSidebarCollapsed]="isSidebarCollapsed"
      [(globalPoSearch)]="globalPoSearch"
      [moduleTitle]="getModuleTitle()"
      [moduleDescription]="getModuleDescription()"
      (searchTriggered)="triggerSearch()"
      (profileOpened)="openProfile()"
      (preferencesOpened)="openPreferences()"
      (helpOpened)="openHelp()"
      (loggedOut)="logout()"
      (cameraScanTriggered)="startCameraScan()">
    </app-dashboard-header>

    <!-- DASHBOARD HERO (Static) -->
    <app-dashboard-modules *ngIf="isDashboardRoute"></app-dashboard-modules>

    <div class="dashboard-scroll-area">
      <!-- DASHBOARD MODULES GRID (Scrollable below hero) -->
      <app-modules-section class="grid-mode-section" *ngIf="isDashboardRoute"
        [isDashboardRoute]="isDashboardRoute"
        [activeModule]="activeModule"
        (navigate)="navigateToRoute($event)">
      </app-modules-section>

      <div class="dashboard-router-container">
        <router-outlet (activate)="onOutletActivate($event)"></router-outlet>
      </div>
    </div>

    <app-dashboard-footer *ngIf="isDashboardRoute"></app-dashboard-footer>
  </div>
</div>
