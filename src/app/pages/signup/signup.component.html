<ion-content [fullscreen]="true" class="signup-content">
  <div class="signup-container">
    <div class="signup-card">
      
      <div class="brand-eyebrow">// Integrated Operations Platform</div>
      <h1 class="signup-title">CREATE ACCOUNT</h1>
      <p class="signup-subtitle">Sign up to access your modules</p>

      <form (ngSubmit)="onSignup()">
        <div class="form-group">
          <label for="tenantId">Workspace Name</label>
          <input type="text" id="tenantId" name="tenantId" [(ngModel)]="tenantId" required placeholder="Enter workspace name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="Enter your password" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Confirm your password" />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!email || !password || password !== confirmPassword">
          Sign Up 
        </button>
      </form>

      <div class="brand-stripe">
        <span class="bs-o"></span>
        <span class="bs-b"></span>
        <span class="bs-s"></span>
      </div>

      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Log in here</a></p>
      </div>
    </div>
  </div>
</ion-content>
