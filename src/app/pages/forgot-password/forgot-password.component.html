<ion-content [fullscreen]="true" class="forgot-password-content">
  <div class="forgot-password-container">
    <div class="forgot-password-card">
      
      <div class="brand-eyebrow">// Integrated Operations Platform</div>
      <h1 class="forgot-password-title">RESET PASSWORD</h1>
      <p class="forgot-password-subtitle">Enter your email to receive a reset link</p>

      <form (ngSubmit)="onResetPassword()">
        <div class="form-group">
          <label for="tenantId">Workspace Name</label>
          <input type="text" id="tenantId" name="tenantId" [(ngModel)]="tenantId" required placeholder="Enter workspace name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Enter your email" />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!email">
          Send Reset Link
        </button>
      </form>

      <div class="brand-stripe">
        <span class="bs-o"></span>
        <span class="bs-b"></span>
        <span class="bs-s"></span>
      </div>

      <div class="login-link">
        <p>Remember your password? <a routerLink="/login">Log in here</a></p>
      </div>
    </div>
  </div>
</ion-content>
