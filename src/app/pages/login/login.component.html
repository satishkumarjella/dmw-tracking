<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <div class="login-card">
      
      <div class="brand-eyebrow">// Integrated Operations Platform</div>
      <h1 class="login-title">DEARBORN PROJECT PORTAL</h1>
      <p class="login-subtitle">Sign in to access your modules</p>

      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!email || !password">
          Login <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="brand-stripe">
        <span class="bs-o"></span>
        <span class="bs-b"></span>
        <span class="bs-s"></span>
      </div>
      
    </div>
  </div>
</ion-content>
