<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper animate-fade-in">
    <!-- Left Side: Branding / Visual (Hidden on mobile) -->
    <div class="login-visual">
      <div class="visual-content animate-slide-up">
        <h2 class="heading-font" *ngIf="configService.config() as config">{{ config.vendorName }}</h2>
        <p>Your enterprise operations platform.<br/>Monitor, track, and manage projects with ease.</p>
      </div>
      <div class="gradient-overlay"></div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="login-form-container">
      <div class="glass-card login-card animate-slide-up">
        <div class="brand-eyebrow">INTEGRATED PLATFORM</div>
        <h1 class="heading-font login-title text-gradient">Welcome Back</h1>
        <p class="login-subtitle">Sign in to access your dashboard</p>

        <form (ngSubmit)="onLogin()">
          <div class="form-group">
            <label for="tenantId">Workspace Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              <input class="input-modern" type="text" id="tenantId" name="tenantId" [(ngModel)]="tenantId" required placeholder="vendor_a" />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input class="input-modern" type="email" id="email" name="email" [(ngModel)]="email" required placeholder="name@company.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input class="input-modern" type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••" />
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-premium login-btn" [disabled]="!email || !password">
            <span>Sign In</span>
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
